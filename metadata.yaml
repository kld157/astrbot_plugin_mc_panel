name: astrbot_plugin_mc_panel
display_name: MC 陪玩面板
short_desc: 把 Minecraft 陪玩 bot 的血量、坐标、延迟、游戏内聊天和动作记录汇总成一个可视化面板。
desc: 读取 mcbot 目录里的 play.log / chat_in.jsonl / act_out.json / cmd.txt，实时展示 bot 在线状态、HP、饥饿度、坐标、延迟、进程存活情况、游戏内聊天流水、小冰的回应和最近动作；支持在面板里直接给游戏内发一句话或下发 ACT 指令。
help: |
  管理面板 → 插件页面 → MC 陪玩面板
  - 状态卡：在线/离线、HP、饥饿、坐标、延迟、心跳、进程守护
  - 聊天流：游戏内最近聊天记录
  - 小冰回应：桥接层最近给出的话
  - 动作记录：最新一次动作与最近的指令下发
  - 输入框：写一行内容，会通过 cmd.txt 交给游戏里的 bot
version: 1.0.4
author: 小冰
repo: https://github.com/kld157/astrbot_plugin_mc_panel
astrbot_version: ">=4.16,<5"
social_link: https://github.com/kld157
tags:
  - minecraft
  - mc
  - 游戏
  - 面板
  - dashboard
